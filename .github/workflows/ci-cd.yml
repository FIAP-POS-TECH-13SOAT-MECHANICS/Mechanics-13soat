name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: 
      - main
      - release
      - develop
  pull_request:
    branches: 
      - main
      - release
      - develop

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  tests:
    uses: ./.github/workflows/dotnet.yml

  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Resolve Environment
        id: resolve
        uses: ./.github/actions/resolve-environment

  apply-infra:
    needs:
      - tests
      - resolve-environment
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/apply-infra.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
    secrets: inherit

  deploy:
    needs: 
      - tests
      - resolve-environment
      - apply-infra
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-ecr.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
    secrets: inherit
