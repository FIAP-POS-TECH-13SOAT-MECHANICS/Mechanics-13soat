name: Push to ECR and Deploy to EKS

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment (dev|stg|prod)
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check if ECR tag exists
        id: ecr_check
        uses: ./.github/actions/ecr-tag-exists
        with:
          environment: ${{ inputs.environment }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.ecr_check.outputs.image-exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.ecr_check.outputs.image-exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.ecr_check.outputs.image-exists == 'false'
        uses: docker/build-push-action@v5
        with:
          push: true
          tags:  |
            ${{ steps.login-ecr.outputs.registry }}/fiap-mechanics-${{ inputs.environment }}-cr:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/fiap-mechanics-${{ inputs.environment }}-cr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get ECR Repository URI
        run: echo "REPOSITORY_URI=$(aws ecr describe-repositories --repository-names fiap-mechanics-${{ inputs.environment }}-cr --query 'repositories[0].repositoryUri' --output text)" >> $GITHUB_ENV

      - name: Install Helm Chart
        run: |
          aws eks update-kubeconfig --name fiap-mechanics-${{ inputs.environment }}-cluster --region ${{ secrets.AWS_REGION }}
          helm upgrade --install fiap-mechanics ./k8s \
            --set image.repository=$REPOSITORY_URI \
            --set image.tag=${{ github.sha }} \
            --set app.env=${{ inputs.environment }}
