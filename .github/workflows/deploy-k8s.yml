name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        description:  Deployment environment (dev|stg|prod)
        required: true
        type: string
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string

jobs:
  deploy-k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    environment: 
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses:  actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name fiap-mechanics-${{ inputs.environment }}-cluster \
            --region us-east-1

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Get ECR Repository URL
        id: ecr-info
        run: |
          REPO_URL=$(aws ecr describe-repositories \
            --repository-names fiap-mechanics-${{ inputs.environment }}-cr \
            --query "repositories[0].repositoryUri" \
            --output text)
          echo "repository_url=$REPO_URL" >> $GITHUB_OUTPUT

      - name: Deploy with Helm
        run: |
          helm upgrade --install \
            --set image.repository=${{ steps.ecr-info.outputs.repository_url }} \
            --set image.tag=${{ inputs.image_tag }} \
            --set app.env=${{ inputs.environment }} \
            --wait \
            --timeout 10m \
            fiap-mechanics ./k8s

      - name:  Verify Deployment
        run: |
          kubectl rollout status deployment/fiap-mechanics -n default --timeout=5m
          kubectl get pods -l app.kubernetes.io/name=fiap-mechanics

      - name: Get Service URL
        id: service-url
        run: |
          echo "Waiting for Load Balancer..."
          sleep 30
          INGRESS_URL=$(kubectl get ingress fiap-mechanics-ingress \
            -o jsonpath='{.status. loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          echo "url=http://$INGRESS_URL" >> $GITHUB_OUTPUT
          echo "### Service URL" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: http://$INGRESS_URL" >> $GITHUB_STEP_SUMMARY

      - name: Health Check
        continue-on-error: true
        run: |
          echo "Waiting for application to be ready..."
          sleep 30
          INGRESS_URL=$(kubectl get ingress fiap-mechanics-ingress \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          if [ -n "$INGRESS_URL" ]; then
            curl -f "http://$INGRESS_URL/health" || echo "⚠️ Health check failed or endpoint not ready yet"
          else
            echo "⚠️ Ingress URL not available yet"
          fi

      - name: Deployment Summary
        run: |
          echo "## ✅ Kubernetes Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: http://$INGRESS_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: fiap-mechanics-${{ inputs.environment }}-cluster" >> $GITHUB_STEP_SUMMARY
