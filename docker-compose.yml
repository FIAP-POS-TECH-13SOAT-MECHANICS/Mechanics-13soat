name: fiap-mechanics

services:
  dotnet:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    depends_on:
      mssql:
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=2%r6dZ6Xk@g3
      - TZ=America/Sao_Paulo
    ports:
      - "1433:1433"
    volumes:
      - mssql:/var/opt/mssql
    healthcheck:
      test: '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mssql:
    name: fiap-mechanics-mssql
