name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: 
      - main
      - release
      - develop
  pull_request:
    branches: 
      - main
      - release
      - develop

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/dotnet.yml

  resolve-environment:
    name: Resolve deployment environment
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Resolve environment
        id: resolve
        uses: ./.github/actions/resolve-environment

  apply-infra:
    name: Apply infrastructure
    needs:
      - tests
      - resolve-environment
    uses: ./.github/workflows/apply-infra.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
    secrets: inherit

  deploy:
    name: Build and Deploy
    needs: [tests, resolve-environment, apply-infra]
    uses:  ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
    secrets: inherit

  deployment-summary:
    needs: [resolve-environment, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ needs.resolve-environment.outputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Steps Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ **Tests** - All tests passed" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ **Infrastructure** - Terraform applied" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ **Docker Build** - Image built and pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ **K8s Deploy** - Application deployed via Helm" >> $GITHUB_STEP_SUMMARY


