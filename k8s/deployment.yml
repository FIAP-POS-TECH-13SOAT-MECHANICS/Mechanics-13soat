apiVersion: apps/v1
kind: Deployment

metadata:
  name: fiap-mechanics

spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiap-mechanics
  template:
    metadata:
      labels:
        app: fiap-mechanics
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: fiap-mechanics
          image: fiap-mechanics:latest
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          envFrom:
            - configMapRef:
                name: mechanics-config
            - secretRef:
                name: mechanics-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
