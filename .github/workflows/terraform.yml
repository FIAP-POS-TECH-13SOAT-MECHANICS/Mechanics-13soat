name: Terraform Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment (dev|stg|prod)
        required: true
        type: string

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get AWS Account ID
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Create bucket
        run: |
          BUCKET_NAME="fiap-mechanics-tf-${ACCOUNT_ID}"

          aws s3 mb s3://${BUCKET_NAME} --region us-east-1 || true

          aws dynamodb create-table \
            --table-name fiap-mechanics-tf \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region us-east-1 2>/dev/null || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_version: 1.14.3

      - name: Init terraform
        run: |
          cd infra &&
          terraform init \
          -backend-config="bucket=fiap-mechanics-tf-${ACCOUNT_ID}" \
          -backend-config="key=dev.tfstate" \
          -backend-config="region=us-east-1" \
          -backend-config="encrypt=true" \
          -backend-config="dynamodb_table=fiap-mechanics-tf" \
          -reconfigure

      - name: Apply terraform
        run: |
          cd infra &&
          terraform apply -auto-approve
      