apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: {{ .Values.app.name }}-keys
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"

spec:
  refreshInterval: 1h
  secretStoreRef:
    name: "{{ .Values.app.name }}-aws-secrets"
    kind: ClusterSecretStore
  target:
    name: {{ .Values.app.name }}-keys
  data:
    - secretKey: jwt-public.pem
      remoteRef:
        key: "{{ .Values.app.name }}-{{ .Values.app.env }}-jwt/public-key"
